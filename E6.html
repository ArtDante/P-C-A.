<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El último secreto</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

}

body {

    overflow: hidden;

    background: #000;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: white;

}


#escena {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background: #000;

}

#imagen {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: 0;

    transition:
        opacity 1.4s ease;

    z-index: 1;

}

#oscurecer {

    position: absolute;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.25);

    opacity: 0;

    transition:
        opacity 1.4s ease;

    z-index: 2;

    pointer-events: none;

}

#texto {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width:
        min(850px, 85vw);

    text-align: center;

    font-size: 28px;

    line-height: 1.7;

    letter-spacing: 2px;

    color: white;

    text-shadow:
        0 2px 15px #000,
        0 0 25px #000;

    opacity: 0;

    transition:
        opacity 1.2s ease;

    z-index: 50;

}


#textoPrincipal {

    display: inline;

}


#subtexto {

    display: block;

    margin-top: 20px;

    font-size: 15px;

    letter-spacing: 2px;

    opacity: 0.7;

}

#negro {

    position: absolute;

    inset: 0;

    background: #000;

    opacity: 1;

    transition:
        opacity 1.4s ease;

    z-index: 40;

    pointer-events: none;

}


#contenedorVideo {

    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #000;

    opacity: 0;

    z-index: 60;

    transition:
        opacity 1.5s ease;

    pointer-events: none;

}

#video {

    display: block;

    width: min(950px, 120vw);

    height: auto;

    max-height: 80vh;

    object-fit: contain;

    background: #000;

    border-radius: 4px;

}


#iniciarVideo {

    position: absolute;

    left: 50%;
    bottom: 7%;

    transform:
        translateX(-50%);

    padding:
        12px 24px;

    border:
        1px solid
        rgba(255,255,255,0.6);

    background:
        rgba(0,0,0,0.7);

    color: white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 15px;

    letter-spacing: 2px;

    cursor: pointer;

    z-index: 70;

    transition:
        background 0.3s ease,
        opacity 0.5s ease;

}


#iniciarVideo:hover {

    background:
        rgba(255,255,255,0.15);

}


#iniciarVideo.oculto {

    opacity: 0;

    pointer-events: none;

}


#fin {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background: #000;

    opacity: 0;

    z-index: 100;

    pointer-events: none;

    transition:
        opacity 2s ease;

}


#fin h1 {

    font-size: 42px;

    font-weight: normal;

    letter-spacing: 10px;

}


#fin p {

    margin-top: 20px;

    font-size: 14px;

    letter-spacing: 3px;

    opacity: 0.5;

}

@media (max-width: 700px) {

    #texto {

        width: 88vw;

        font-size: 21px;

        line-height: 1.6;

        letter-spacing: 1px;

    }


    #video {

        width: 90vw;

        max-height: 65vh;

    }


    #fin h1 {

        font-size: 30px;

        letter-spacing: 7px;

    }

}

</style>

</head>


<body>


<div id="escena">

    <img
        id="imagen"
        src=""
        alt=""
    >


    <div id="oscurecer"></div>

    <div id="texto">

        <span id="textoPrincipal"></span>

        <span id="subtexto"></span>

    </div>


    <div id="negro"></div>


    <div id="contenedorVideo">

        <video
            id="video"
            controls
            playsinline
            preload="metadata"
        >

            <source
                src="img/V1.mp4"
                type="video/mp4"
            >

            Tu navegador no puede reproducir este video.

        </video>


        <button id="iniciarVideo">

            ▶ Reproducir

        </button>

    </div>

    <div id="fin">

        <h1>
            	FIN.
        </h1>

        <p>
            Felicidades Ale, Te quiero.
        </p>

    </div>


</div>



<script>



const imagen =
    document.getElementById("imagen");

const oscurecer =
    document.getElementById("oscurecer");

const texto =
    document.getElementById("texto");

const textoPrincipal =
    document.getElementById("textoPrincipal");

const subtexto =
    document.getElementById("subtexto");

const negro =
    document.getElementById("negro");

const contenedorVideo =
    document.getElementById("contenedorVideo");

const video =
    document.getElementById("video");

const iniciarVideo =
    document.getElementById("iniciarVideo");

const fin =
    document.getElementById("fin");


const escenas = [

    {
        imagen: "img/F1.jpeg",

        texto:
        "Siempre llega algo bueno en Mondstadt!. Hoy tambien puede traerte un poco de calma o ganas de hacer lo que se te antoje.",

        subtexto:
        ""  
    },

    {
        imagen: "img/F2.jpeg",

        texto:
        "Como en este puerto llegan cosas de todas partes. Ojala hoy te llegue algo bonito, aunque sea solo una que te haga sacar esa linda sonrisa.",

        subtexto:
        ""
    },

    {
        imagen: "img/F3.jpeg",

        texto:
        "Hasta los hongos mas grandes necesitan su espacio. Tu tambien ten uno solo tuyo para respirar y estar bien.",

        subtexto:
        ""
    },

    {
        imagen: "img/F4.jpeg",

        texto:
        "Desde lo alto todo se ve un poco mas claro. Hoy mira todo desde arriba y decir que si puedes.",

        subtexto:
        ""
    },

    {
        imagen: "img/F5.jpeg",

        texto:
        "Todo parece vacio, pero siempre encontraras caminos que solo se ven cuando caminas despacio. Sin prisa.",

        subtexto:
        ""
    },

    {
        imagen: "img/F6.jpeg",

        texto:
        "Donde solo encuentras espuma y agua, existe flotando sin demostrar nada.",

        subtexto:
        ""
    },

    {
        imagen: "img/F7.jpeg",

        texto:
        "Se celebran muchas victorias y hoy una de ellas puede ser que lo estas haciendo bien .",

        subtexto:
        ""
    }

];

const pausaInicial =
    1200;

const duracionTextoInicial =
    4500;

const duracionEscena =
    5000;

const duracionNegro =
    1200;


function esperar(tiempo) {

    return new Promise(
        resolver =>
            setTimeout(
                resolver,
                tiempo
            )
    );

}


function cargarImagen(ruta) {

    return new Promise(
        resolver => {

            const nuevaImagen =
                new Image();


            nuevaImagen.onload =
                () => {

                    resolver(true);

                };


            nuevaImagen.onerror =
                () => {

                    console.error(
                        "ERROR: No se pudo cargar:",
                        ruta
                    );

                    resolver(false);

                };


            nuevaImagen.src =
                ruta;

        }
    );

}


async function escribirTexto(
    elemento,
    contenido,
    velocidad = 45
) {

    elemento.textContent = "";


    for (
        let i = 0;
        i < contenido.length;
        i++
    ) {

        elemento.textContent +=
            contenido[i];


        await esperar(
            velocidad
        );

    }

}

async function inicio() {


    /*
        Negro absoluto.
    */

    negro.style.opacity = "1";


    imagen.style.opacity = "0";

    oscurecer.style.opacity = "0";


    await esperar(
        pausaInicial
    );


    /*
        Mostrar texto.
    */

    texto.style.opacity = "1";


    await escribirTexto(
        textoPrincipal,
        "Hay algo que no te he contado...",
        65
    );


    await esperar(
        1800
    );


    /*
        Desaparece.
    */

    texto.style.opacity = "0";


    await esperar(
        1300
    );

}


async function mostrarEscena(
    datos
) {


    /*
        NEGRO
    */

    negro.style.opacity = "1";


    texto.style.opacity = "0";

    imagen.style.opacity = "0";

    oscurecer.style.opacity = "0";


    await esperar(
        duracionNegro
    );


    /*
        Precargar imagen.
    */

    const cargada =
        await cargarImagen(
            datos.imagen
        );


    if (!cargada) {

        console.warn(
            "Revisa el nombre:",
            datos.imagen
        );

    }


    /*
        Preparar texto.
    */

    textoPrincipal.textContent =
        "";

    subtexto.textContent =
        datos.subtexto;


    /*
        PAAAM
        Imagen.
    */

    imagen.src =
        datos.imagen;


    negro.style.opacity = "0";

    imagen.style.opacity = "1";

    oscurecer.style.opacity = "1";


    await esperar(
        700
    );


    /*
        Texto.
    */

    texto.style.opacity = "1";


    await escribirTexto(
        textoPrincipal,
        datos.texto,
        35
    );


    /*
        Mantener escena.
    */

    await esperar(
        duracionEscena
    );


    /*
        Desaparece texto.
    */

    texto.style.opacity = "0";


    await esperar(
        900
    );


    /*
        Vuelve a negro.
    */

    negro.style.opacity = "1";

    imagen.style.opacity = "0";

    oscurecer.style.opacity = "0";


    await esperar(
        duracionNegro
    );

}


async function mostrarVideo() {


    /*
        Todo negro.
    */

    negro.style.opacity = "1";

    imagen.style.opacity = "0";

    texto.style.opacity = "0";


    await esperar(
        1500
    );


    /*
        Mostrar contenedor.
    */

    contenedorVideo.style.opacity =
        "1";

    contenedorVideo.style.pointerEvents =
        "auto";


    /*
        Mostrar botón.
    */

    iniciarVideo.classList.remove(
        "oculto"
    );


    /*
        No intentamos autoplay.
        El usuario puede iniciar
        el video.
    */

}


iniciarVideo.addEventListener(
    "click",
    async () => {

        iniciarVideo.classList.add(
            "oculto"
        );


        try {

            await video.play();

        }

        catch (error) {

            console.error(
                "No se pudo reproducir V1.mp4",
                error
            );

            iniciarVideo.classList.remove(
                "oculto"
            );

        }

    }
);

video.addEventListener(
    "ended",
    async () => {


        /*
            Ocultar video.
        */

        contenedorVideo.style.opacity =
            "0";

        contenedorVideo.style.pointerEvents =
            "none";


        await esperar(
            1800
        );


        /*
            FIN.
        */

        fin.style.opacity =
            "1";

    }
);


async function iniciar() {


    /*
        1.
        Frase negra.
    */

    await inicio();


    /*
        2.
        F1 → F7
    */

    for (
        const escena of escenas
    ) {

        await mostrarEscena(
            escena
        );

    }


    /*
        3.
        Video.
    */

    await mostrarVideo();

}

iniciar();

</script>


</body>

</html>
