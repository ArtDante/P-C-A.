<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti Ale ✨</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f1ea;
    }

    .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;

        background:
            radial-gradient(
                circle at 50% 45%,
                rgba(255,255,255,.9),
                transparent 70%
            ),
            #f4f1ea;
    }

    .message {
        position: absolute;
        z-index: 1;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;

        text-align: center;
        padding: 30px;

        color: #222;

        pointer-events: none;
    }

    .message small {
        font-size: clamp(13px, 1.5vw, 18px);
        letter-spacing: 4px;
        text-transform: uppercase;
        opacity: .55;
        margin-bottom: 14px;
    }

    .message h1 {
        font-size: clamp(42px, 7vw, 90px);
        font-weight: 700;
        letter-spacing: -3px;
    }

    .message p {
        margin-top: 18px;
        max-width: 500px;

        font-size: clamp(15px, 2vw, 21px);
        line-height: 1.5;

        opacity: .65;
    }

    .cube-field {
        position: absolute;
        z-index: 5;
        inset: 0;

        perspective: 1200px;
        transform-style: preserve-3d;

        pointer-events: none;
    }

    .cube {
        --w: 80px;
        --h: 60px;
        --d: 80px;
        --color: #1683ff;
        --z: 0px;
        --rx: 0deg;
        --ry: 0deg;
        --rz: 0deg;

        position: absolute;

        width: var(--w);
        height: var(--h);

        transform-style: preserve-3d;

        transform:
            translateZ(var(--z))
            rotateX(var(--rx))
            rotateY(var(--ry))
            rotateZ(var(--rz));

        cursor: pointer;
        pointer-events: auto;

        /* IMPORTANTE:
           NO HAY ANIMACIÓN
        */
        animation: none;

        transition: none;
    }

    .face {
        position: absolute;

        background: var(--color);

        opacity: .94;

        backface-visibility: visible;
    }

    .front {
        width: var(--w);
        height: var(--h);

        transform:
            translateZ(calc(var(--d) / 2));
    }

    .back {
        width: var(--w);
        height: var(--h);

        transform:
            rotateY(180deg)
            translateZ(calc(var(--d) / 2));
    }

    .right {
        width: var(--d);
        height: var(--h);

        left: calc((var(--w) - var(--d)) / 2);

        transform:
            rotateY(90deg)
            translateZ(calc(var(--w) / 2));

        filter: brightness(.72);
    }

    .left {
        width: var(--d);
        height: var(--h);

        left: calc((var(--w) - var(--d)) / 2);

        transform:
            rotateY(-90deg)
            translateZ(calc(var(--w) / 2));

        filter: brightness(.82);
    }

    .top {
        width: var(--w);
        height: var(--d);

        top: calc((var(--h) - var(--d)) / 2);

        transform:
            rotateX(90deg)
            translateZ(calc(var(--h) / 2));

        filter: brightness(1.15);
    }

    .bottom {
        width: var(--w);
        height: var(--d);

        top: calc((var(--h) - var(--d)) / 2);

        transform:
            rotateX(-90deg)
            translateZ(calc(var(--h) / 2));

        filter: brightness(.58);
    }

    .cube:hover {
        filter: brightness(1.08);
    }

    .cube.removing {
        opacity: 0;
        pointer-events: none;
    }

    .counter {
        position: absolute;
        z-index: 20;

        top: 22px;
        right: 25px;

        font-size: 13px;
        letter-spacing: 2px;

        opacity: .45;
    }

    .next {
        position: absolute;
        z-index: 20;

        left: 50%;
        bottom: 35px;

        transform: translateX(-50%);

        border: 1px solid rgba(0,0,0,.18);

        background: rgba(255,255,255,.72);

        backdrop-filter: blur(10px);

        padding: 13px 25px;

        border-radius: 999px;

        font-size: 15px;

        cursor: pointer;

        opacity: 0;
        pointer-events: none;

        transition: opacity .3s ease;
    }


    .next.show {
        opacity: 1;
        pointer-events: auto;
    }


    .next:hover {
        background: white;
    }

    @media (max-width: 600px) {

        .cube {
            transform:
                translateZ(var(--z))
                rotateX(var(--rx))
                rotateY(var(--ry))
                rotateZ(var(--rz))
                scale(.72);
        }

        .message h1 {
            letter-spacing: -2px;
        }
    }

</style>

</head>

<body>

<div class="scene">



<div class="message">

    <small> Bueno, primero hay cosas que quiero enseñarte </small>

    <h1>
        Espera un poquito y confia...
    </h1>

    <p>
        Hay algunas cosas que primero tendrás que descubrir.
    </p>

</div>



<div
    class="cube-field"
    id="cubeField">
</div>



<div
    class="counter"
    id="counter">

    0 / 130

</div>



<button
    class="next"
    id="nextButton">

    Continuar →

</button>

</div>

<script>

    const field =
        document.getElementById("cubeField");

    const counter =
        document.getElementById("counter");

    const nextButton =
        document.getElementById("nextButton");


    const colors = [

        "#0879f9",
        "#13b5c8",
        "#16c957",
        "#a8df22",
        "#ffbe55",
        "#ff794d",
        "#ff3f8e",
        "#9b51e0",
        "#5146d8",
        "#20a99b",
        "#e84a8a",
        "#f0a32e"

    ];


    const total = 130;

    let removed = 0;


    for (let i = 0; i < total; i++) {

        const cube =
            document.createElement("div");

        cube.className = "cube";


        const w =
            45 + Math.random() * 85;

        const h =
            35 + Math.random() * 65;

        const d =
            40 + Math.random() * 80;


        cube.style.setProperty(
            "--w",
            `${w}px`
        );

        cube.style.setProperty(
            "--h",
            `${h}px`
        );

        cube.style.setProperty(
            "--d",
            `${d}px`
        );


        cube.style.setProperty(
            "--color",
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ]
        );




        cube.style.left =
            `${25 + Math.random() * 50}%`;

        cube.style.top =
            `${25 + Math.random() * 50}%`;

        cube.style.setProperty(
            "--z",
            `${-250 + Math.random() * 500}px`
        );


        cube.style.setProperty(
            "--rx",
            `${-20 + Math.random() * 40}deg`
        );

        cube.style.setProperty(
            "--ry",
            `${-20 + Math.random() * 40}deg`
        );

        cube.style.setProperty(
            "--rz",
            `${-20 + Math.random() * 40}deg`
        );


        cube.innerHTML = `

            <div class="face front"></div>

            <div class="face back"></div>

            <div class="face right"></div>

            <div class="face left"></div>

            <div class="face top"></div>

            <div class="face bottom"></div>

        `;


        cube.addEventListener(
            "click",
            () => {

                if (
                    cube.classList.contains(
                        "removing"
                    )
                ) {

                    return;

                }


                cube.classList.add(
                    "removing"
                );


                removed++;


                counter.textContent =
                    `${removed} / ${total}`;

                if (removed === total) {

                    nextButton.classList.add(
                        "show"
                    );

                }

            }
        );


        field.appendChild(cube);

    }

    nextButton.addEventListener(
        "click",
        () => {

            window.location.href = "E2.html";


        }
    );

</script>

</body>
</html>
